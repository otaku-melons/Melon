[project]
name = "melon"
version = "1.0.0-rc.5"
description = "Modular parsers management system."
readme = "README.md"
authors = [
    { name = "DUB1401", email = "vlad.milosta@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
	"beautifulsoup4",
	"deepmerge",
	"dublib==0.30.1",
	"dulwich>=1.2.6",
	"EbookLib",
	"imagehash",
	"img2pdf",
	"pillow",
	"python-dotenv",
	"uv"
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[project.scripts]
melon = "melon:main"
pxm = "melon:main"
urun = "melon:main"

[build-system]
requires = ["uv-build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
non_interactive = true
follow_imports = "silent"
files = ["src"]

[tool.ruff.lint]
select = ["A", "ARG", "C", "E", "F", "I", "TC"]
ignore = ["C901", "E701", "E501"]

[tool.ruff.lint.isort]
lines-after-imports = 1
sections = {"dublib" = ["dublib"]}
section-order = [
	"future",
	"standard-library",
	"third-party",
	"dublib",
	"first-party",
	"local-folder"
]